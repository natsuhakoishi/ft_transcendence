services:
  backend:
    build: ./app/srcs/backend
    container_name: backend_app
    env_file: ./app/srcs/backend/.env
    ports:
        - "4242:4242"
    volumes:
        - ./database:/database
        - ./app/srcs/backend:/app/srcs/backend
    networks:
        - klbq_network

  frontend:
    build: ./app/srcs/frontend
    container_name: frontend_app
    env_file: ./app/srcs/frontend/.env
    ports:
        - "5173:5173"
    volumes:
        - ./app/srcs/frontend:/app/srcs/frontend
    networks:
        - klbq_network

networks:
    klbq_network:

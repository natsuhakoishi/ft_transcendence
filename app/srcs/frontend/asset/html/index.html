<!DOCTYPE html>
<html>
<head>
  <title>History API Navigation</title>
</head>
<body>
  <nav>
    <a href="/home" onclick="navigate(event, 'home')">Home</a>
    <a href="/about" onclick="navigate(event, 'about')">About</a>
    <a href="/contact" onclick="navigate(event, 'contact')">Contact</a>
  </nav>

  <div id="content"></div>

  <script>
    function navigate(event, page) {
      event.preventDefault();
      history.pushState({page}, "", "/" + page);
      renderPage(page);
    }

    function renderPage(page) {
      let content = document.getElementById("content");
      if (page === "about") content.innerHTML = "<h2>About Page</h2>";
      else if (page === "contact") content.innerHTML = "<h2>Contact Page</h2>";
      else content.innerHTML = "<h2>Home Page</h2>";
    }

    window.addEventListener("popstate", (event) => {
      renderPage(event.state?.page || "home");
    });

    renderPage("home");
  </script>
</body>
</html>
